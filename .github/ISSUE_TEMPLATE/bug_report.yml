name: 🐛 Bug report
description: Something in the engine, package, components, skins, or skills isn't working
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill out the sections below.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I run /ss-page, the generated file ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install with `npx skills add bitjaru/styleseed`
        2. Run ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Components / patterns
        - Skins / theme.css
        - Motion (personality seeds / keyword moves)
        - Skills (/ss-*)
        - Resolver / project registry / update
        - Codex or Claude package
        - Evidence gate
        - Design rules / docs
        - Setup / install
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: StyleSeed version or revision, agent + version, framework, OS
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, the prompt you used, etc.
