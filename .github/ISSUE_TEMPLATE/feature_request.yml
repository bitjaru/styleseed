name: 💡 Feature or integration request
description: Suggest a product capability, integration, component, skin, or agent workflow
title: "[Request] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: A capability, integration, component, motion move, skin, adapter, or /ss-* skill.
      placeholder: A `toggle-fold` motion keyword that ...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: What problem does it solve, or what does it make easier for AI-built UI?
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Product workflow
        - Integration / install channel
        - Component / pattern
        - Motion (seed / keyword move)
        - Skin / palette / brand recipe
        - Grammar / adapter
        - Skill (/ss-*)
        - Evidence / verification
        - Documentation / example
        - Other
    validations:
      required: true
