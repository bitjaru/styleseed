name: Validate StyleSeed engine

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: styleseed-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-pricing/package-lock.json
      - name: Install demo dependencies
        run: npm ci
        working-directory: demo-pricing
      - name: Run canonical repository verification
        run: node scripts/verify-repo.mjs
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
        working-directory: demo-pricing
      - name: Run browser smoke tests
        run: npm run test:browser
        working-directory: demo-pricing
      - name: Run disposable external application regression
        run: node scripts/test-external-app.mjs --output "$RUNNER_TEMP/styleseed-external-app-report"
      - name: Upload external application diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-app-regression-${{ github.run_attempt }}
          path: ${{ runner.temp }}/styleseed-external-app-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Check pilot React and CSS integration
        run: node scripts/test-design-pilot-library.mjs --output "${{ runner.temp }}/styleseed-pilot-library"
      - name: Calibrate three-screen browser acceptance
        run: node scripts/test-design-pilot-browser.mjs --calibrate --output "${{ runner.temp }}/styleseed-pilot-browser"
      - name: Preserve browser calibration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: styleseed-pilot-browser-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/styleseed-pilot-browser
            ${{ runner.temp }}/styleseed-pilot-library/report.json
            ${{ runner.temp }}/styleseed-pilot-library/*.png
          if-no-files-found: ignore
          retention-days: 14

  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # Keep each native check in its own step so a later success cannot mask its exit code.
      - name: Regenerate context catalog on Windows
        run: node scripts/build-context-catalog.mjs
      - name: Regenerate learning catalog on Windows
        run: node extensions/learning/runtime/scripts/build-learning-catalog.mjs
      - name: Regenerate public mirrors on Windows
        run: node demo-pricing/scripts/build-llms.mjs
      - name: Check public claims on Windows
        run: node scripts/test-public-claims.mjs
      - name: Run runtime contracts on Windows
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem "scripts/runtime-tests/*.test.mjs" | ForEach-Object { $_.FullName }
          if (-not $testFiles) { throw "No runtime contract tests found" }
          node --test $testFiles
      - name: Validate engine on Windows
        run: node scripts/validate-engine.mjs
      - name: Check Markdown links on Windows
        run: node scripts/check-markdown-links.mjs
      - name: Install the current checkout through PowerShell
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "styleseed-install-smoke"
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          git -C $probe init --quiet
          if ($LASTEXITCODE -ne 0) { throw "Install probe git init failed ($LASTEXITCODE)" }
          Push-Location $probe
          try {
            npx.cmd skills add $env:GITHUB_WORKSPACE --agent codex --yes --copy
            if ($LASTEXITCODE -ne 0) { throw "Skill installation failed ($LASTEXITCODE)" }
            npx.cmd skills list --json --agent codex | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Installed skill listing failed ($LASTEXITCODE)" }
            $skills = @(Get-ChildItem ".agents/skills" -Directory)
            if ($skills.Count -ne 23) {
              throw "Expected 23 installed skills, found $($skills.Count)"
            }
            if (-not (Test-Path ".agents/skills/styleseed/SKILL.md" -PathType Leaf)) {
              throw "Missing project-local StyleSeed router"
            }
            if (Test-Path ".agents/skills/ss-learn") {
              throw "Optional learning extension leaked into the core install"
            }
            $links = @(Get-ChildItem ".agents/skills" -Recurse -Attributes ReparsePoint -ErrorAction SilentlyContinue)
            if ($links.Count -ne 0) {
              throw "Expected physical copies, found $($links.Count) reparse points"
            }
          }
          finally {
            Pop-Location
          }
      - run: git diff --check
      - run: git diff --exit-code
