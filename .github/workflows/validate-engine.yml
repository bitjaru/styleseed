name: Validate StyleSeed engine

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-pricing/package-lock.json
      - run: node scripts/validate-engine.mjs
      - run: npm ci
        working-directory: demo-pricing
      - run: npm run build
        working-directory: demo-pricing
