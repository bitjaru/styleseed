name: Validate StyleSeed engine

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-pricing/package-lock.json
      - run: node scripts/build-context-catalog.mjs
      - run: node extensions/learning/runtime/scripts/build-learning-catalog.mjs
      - run: node demo-pricing/scripts/build-llms.mjs
      - run: node scripts/validate-skill-contracts.mjs
      - run: node scripts/test-router-contract.mjs
      - run: node scripts/test-core-learning-isolation.mjs
      - run: node scripts/test-core-plugin-boundary.mjs
      - run: node scripts/test-public-claims.mjs
      - run: node scripts/test-learning-security.mjs
      - run: node scripts/validate-palettes.mjs
      - run: node --test scripts/runtime-tests/*.test.mjs
      - run: node scripts/validate-engine.mjs
      - run: node scripts/build-plugin-packages.mjs --clean
      - run: node scripts/validate-plugin-packages.mjs
      - run: node scripts/check-markdown-links.mjs
      - run: npm ci
        working-directory: demo-pricing
      - run: npm run build
        working-directory: demo-pricing
      - run: git diff --check
      - run: git diff --exit-code
